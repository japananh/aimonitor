name: 🐞 Bug report
description: Something in aimonitor isn't working
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: Any logs I paste contain no tokens or secrets.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The version and a way to reproduce it matter most; the rest is a bonus.
      placeholder: |
        What I did, what happened, what I expected instead.
        Version + OS (aimonitor version), and anything useful from aimonitor doctor.
    validations:
      required: true
