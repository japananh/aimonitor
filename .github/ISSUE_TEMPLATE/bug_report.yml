name: 🐞 Bug report
description: Something in aimonitor isn't working
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues, and any logs I paste contain no tokens or secrets.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, what you expected, and how to reproduce it.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version + OS (optional)
      placeholder: "aimonitor 1.1.27 · macOS Apple Silicon"
  - type: textarea
    id: logs
    attributes:
      label: Logs / doctor (optional)
      description: "`aimonitor doctor`, or the daemon log at ~/Library/Logs/aimonitor/ — check for secrets first."
      render: text
