name: 🐞 Bug report
description: Something in aimonitor isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, what you expected, and how to reproduce it. Include your version & OS (`aimonitor doctor`), and remove any tokens or secrets from logs.
    validations:
      required: true
